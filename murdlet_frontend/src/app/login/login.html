<div class="login-page">
    <h1 style="margin-top: 5rem; font-size: xxx-large; font-family:'Courier New', Courier, monospace">murdlet</h1>
    <mat-card class="login-card">
        <mat-card-header>
            <mat-card-title>Login</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="loginForm" (ngSubmit)="login()">
                <mat-form-field appearance="outline" style="padding-top: 1em;">
                    <mat-label>Username</mat-label>
                    <input matInput type="text" formControlName="username" required>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Password</mat-label>
                    <input matInput type="password" formControlName="password" required>
                </mat-form-field>

                <button mat-raised-button color="primary" type="submit">
                    Login
                </button>
            </form>
        </mat-card-content>

        <mat-card-actions>
            No Account yet?
            <button mat-button type="button" (click)="openRegisterDialog()">
                Register
            </button>
        </mat-card-actions>
    </mat-card>
</div>
