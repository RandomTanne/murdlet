<h2 mat-dialog-title>Register</h2>

<mat-dialog-content>
  <div class="register-content">
    <form [formGroup]="registerForm" id="registerForm" (ngSubmit)="register()">
      <mat-form-field appearance="outline" style="padding-top: 1em; width: 100%;">
        <mat-label>Username</mat-label>
        <input matInput type="text" formControlName="username" required>
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" required>
      </mat-form-field>
    </form>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" type="submit" form="registerForm">
    Register
  </button>
</mat-dialog-actions>
